[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "finance-timeseries-ml-platform"
version = "0.1.0"
description = "End-to-end financial time-series ML platform for learning data engineering, machine learning, MLOps, APIs, orchestration, and BI."
readme = "README.md"
requires-python = ">=3.11,<3.14"

dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "python-dotenv>=1.0",
    "databricks-sql-connector>=4.0",
]


[project.optional-dependencies]
dev = [
    "pytest>=8",
]


[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]