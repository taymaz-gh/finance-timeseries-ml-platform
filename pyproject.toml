[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "finance-timeseries-ml-platform"
version = "0.1.0"
description = "End-to-end financial time-series ML platform for learning data engineering, machine learning, MLOps, APIs, orchestration, and BI."
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    "numpy>=2.0",
    "pandas>=2.2,<3.0",
    "python-dotenv>=1.0",
    "databricks-sql-connector>=4.0",
    "sqlalchemy>=2.0,<2.1",
    "databricks-sqlalchemy>=2.0",
    "tensorflow>=2.21,<2.22",
    "matplotlib>=3.9,<4.0",
    "mlflow>=3.12,<4.0",
]


[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pyspark>=4.0",
]


[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]


[tool.databricks.environment]
environment_version = "6"