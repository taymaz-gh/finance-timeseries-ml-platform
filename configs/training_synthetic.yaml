
# Local demonstration only — never register or remotely log a model.
run_mode: development
log_to_mlflow: false
register_in_uc: false

# Keeping the example small enough for local experimentation.
epochs: 2
batch_size: 16
lstm_units: [8]
patience: 1
verbose: 0
save_keras_checkpoint: false
artifact_dir: artifacts/synthetic_training
